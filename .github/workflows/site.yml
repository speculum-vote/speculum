name: Deploy site

# Redeploys both sites whenever code or templates change, without fetching new data.
on:
  push:
    branches: [main]
    paths: ["speculum/**", "functions/**", "scripts/**", "data/chains/**", "data/tide/**", "data/*.json", ".github/workflows/site.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m speculum build --out dist
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPECULUM_ADMIN_PASSWORD: ${{ secrets.SPECULUM_ADMIN_PASSWORD }}
          CLOUDFLARE_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
        run: bash scripts/deploy.sh
