name: PPP lobbying 2020-21 (one-time)

# By hand: reads every 2020 and 2021 quarterly lobbying report (about 8,000 pages) for the PPP case and commits
# data/records/ppp_lobbying.json. Resumable: run it again if a run stops for time; finished quarters are kept.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch (read every report), spot (re-read a sample of matches) or borrowers (match PPP loans to lobbying)"
        default: fetch
      names:
        description: "spot only: organization keys to add, separated by |"
        default: ""

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read 2020-21 lobbying reports
        if: inputs.mode == 'fetch' || inputs.mode == ''
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
        run: python -m speculum ppplobby --minutes 270
      - name: Re-read a sample of matches
        if: inputs.mode == 'spot'
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          NAMES: ${{ inputs.names }}
        run: python -m speculum pppspot --n 40 --names "$NAMES"
      - name: Every 2019-21 report naming the given clients
        if: inputs.mode == 'check'
        env:
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          NAMES: ${{ inputs.names }}
        run: python -m speculum pppcheck --names "$NAMES"
      - name: Match PPP loans to lobbying clients and firms
        if: inputs.mode == 'borrowers'
        run: python -m speculum pppborrowers
      - name: Commit
        if: always()
        run: |
          git config user.name "speculum-bot"
          git config user.email "speculum-bot@users.noreply.github.com"
          for f in ppp_lobbying ppp_spot ppp_borrowers ppp_check; do [ -f data/records/$f.json ] && git add data/records/$f.json; done; true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "PPP lobbying 2020-21 (${{ inputs.mode }})"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
