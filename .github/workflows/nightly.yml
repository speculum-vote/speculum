name: Nightly snapshot
# A full run for today (scheduled, or started by hand with no inputs) is titled "Nightly snapshot today all";
# the gate uses that title so a hand-started full run also stands in for a dropped scheduled one.
run-name: "Nightly snapshot ${{ inputs.date || 'today' }} ${{ inputs.only || 'all' }}"

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC: 5:17am Eastern in winter, after overnight filings post
    - cron: "47 13 * * *"   # backup: GitHub sometimes delays or drops scheduled runs; the gate below
                            # lets this one run only if no nightly run has started or succeeded today
  workflow_dispatch:
    inputs:
      date:
        description: "Snapshot date override (YYYY-MM-DD); leave blank for today"
        required: false
      only:
        description: "Rerun only these sources for that date (space-separated: votes finance lobbying spend advocacy); blank for all"
        required: false
      by:
        description: "Left blank by hand; the Cloudflare scheduler sets it so the daily gate applies"
        required: false

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Started by hand: always run. Scheduled by GitHub or by the Cloudflare scheduler: run only if
          # no full run has started or succeeded today.
          if [ "${{ github.event_name }}" != "schedule" ] && [ "${{ inputs.by }}" != "scheduler" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          TODAY=$(date -u +%F)
          # Only full runs for today count (scheduled, or by hand with no inputs); a partial rerun
          # (one source, an earlier night) is not tonight's run.
          N=$(gh run list -R "$GITHUB_REPOSITORY" -w nightly.yml -L 30 --json databaseId,createdAt,status,conclusion,displayTitle \
            --jq "[.[] | select(.databaseId < ${{ github.run_id }}) | select(.displayTitle == \"Nightly snapshot today all\") | select(.createdAt[0:10] == \"$TODAY\")
                  | select(.status != \"completed\" or .conclusion == \"success\")] | length")
          echo "other nightly runs today that are running or succeeded: $N"
          if [ "$N" -gt 0 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  snapshot:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      # Check out the branch tip when the job starts, not the commit it was queued at: a run that waited
      # behind another one in the "nightly" group must start from that run's snapshot, or its own
      # snapshot for the same night conflicts with it when pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch every source and write the snapshot
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
        run: python -m speculum snapshot ${{ inputs.date && format('--date {0}', inputs.date) || '' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }}

      - name: Draft research for new consequence chains (only when an Anthropic key is set)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m speculum chains --draft --limit 3

      - name: Revise drafted claims that did not pass last night's source check, once each (only when an Anthropic key is set)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m speculum chains --revise --limit 30

      - name: Check new, changed and disputed claims against their sources (only when an Anthropic key is set)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m speculum verify --limit 80

      - name: "Said & Done: count a closed readers' round and open the winning bill"
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m speculum saiddone

      - name: Commit the snapshot
        run: |
          git config user.name "speculum-bot"
          git config user.email "speculum-bot@users.noreply.github.com"
          git add data/snapshots
          for f in data/chains/drafts data/chains/checks.json data/chains/disputes.json data/records data/saiddone.json; do [ -e "$f" ] && git add "$f"; done
          # Even with nothing to commit, build from the newest main (a launch switch or a correction pushed during the run).
          if git diff --cached --quiet; then echo "no changes"; git pull --rebase origin main || true; exit 0; fi
          DATE=$(ls data/snapshots | sort | tail -1)
          git commit -m "Snapshot $DATE"
          # Code may have been pushed while this run was fetching; replay the snapshot on top of it.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::error::Could not push the snapshot (conflict with a newer commit). The fetched data is in the raw archive for this run."
          exit 1

      - name: Archive raw filings as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(ls data/raw | sort | tail -1)
          tar -czf "raw-$DATE.tar.gz" -C data/raw "$DATE"
          sha256sum "raw-$DATE.tar.gz" > "raw-$DATE.tar.gz.sha256"
          gh release create "raw-$DATE" "raw-$DATE.tar.gz" "raw-$DATE.tar.gz.sha256" "data/raw/$DATE/MANIFEST.jsonl" \
            --title "Raw filings $DATE" \
            --notes "Untouched source files fetched on $DATE, with SHA-256 manifest." && exit 0
          # A later run for the same date (a partial rerun) adds its files beside the first set, never over them.
          SUF="run${{ github.run_id }}"
          mv "raw-$DATE.tar.gz" "raw-$DATE-$SUF.tar.gz"
          sha256sum "raw-$DATE-$SUF.tar.gz" > "raw-$DATE-$SUF.tar.gz.sha256"
          cp "data/raw/$DATE/MANIFEST.jsonl" "MANIFEST-$SUF.jsonl"
          gh release upload "raw-$DATE" "raw-$DATE-$SUF.tar.gz" "raw-$DATE-$SUF.tar.gz.sha256" "MANIFEST-$SUF.jsonl"

      - name: Build the site
        run: python -m speculum build --out dist

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy public holding page and private preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPECULUM_ADMIN_PASSWORD: ${{ secrets.SPECULUM_ADMIN_PASSWORD }}
          CLOUDFLARE_ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_TOKEN }}
        run: bash scripts/deploy.sh
